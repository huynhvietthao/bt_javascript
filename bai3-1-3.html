
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đổi năm dương lịch sang âm lịch</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 380px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: darkred;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Đổi năm dương lịch sang âm lịch</h2>

        <label>Nhập năm dương lịch:</label>

        <input type="number" id="year" placeholder="Ví dụ: 2026">

        <button onclick="convertYear()">Chuyển đổi</button>

        <div id="result"></div>

    </div>

    <script>
        function convertYear() {

            let nam_duong_lich =
                Number(document.getElementById("year").value);

            if (
                document.getElementById("year").value === "" ||
                !Number.isInteger(nam_duong_lich) ||
                nam_duong_lich <= 0
            ) {
                alert("Vui lòng nhập năm hợp lệ!");
                return;
            }

            let can = "";
            let chi = "";

            // Tìm Can theo phần dư chia 10
            switch (nam_duong_lich % 10) {

                case 0:
                    can = "Canh";
                    break;

                case 1:
                    can = "Tân";
                    break;

                case 2:
                    can = "Nhâm";
                    break;

                case 3:
                    can = "Quý";
                    break;

                case 4:
                    can = "Giáp";
                    break;

                case 5:
                    can = "Ất";
                    break;

                case 6:
                    can = "Bính";
                    break;

                case 7:
                    can = "Đinh";
                    break;

                case 8:
                    can = "Mậu";
                    break;

                case 9:
                    can = "Kỷ";
                    break;
            }

            // Tìm Chi theo phần dư chia 12
            switch (nam_duong_lich % 12) {

                case 0:
                    chi = "Thân";
                    break;

                case 1:
                    chi = "Dậu";
                    break;

                case 2:
                    chi = "Tuất";
                    break;

                case 3:
                    chi = "Hợi";
                    break;

                case 4:
                    chi = "Tý";
                    break;

                case 5:
                    chi = "Sửu";
                    break;

                case 6:
                    chi = "Dần";
                    break;

                case 7:
                    chi = "Mẹo";
                    break;

                case 8:
                    chi = "Thìn";
                    break;

                case 9:
                    chi = "Tỵ";
                    break;

                case 10:
                    chi = "Ngọ";
                    break;

                case 11:
                    chi = "Mùi";
                    break;
            }

            document.getElementById("result").innerHTML =
                nam_duong_lich + " : " + can + " " + chi;
        }
    </script>

</body>
</html>
