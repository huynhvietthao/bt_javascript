
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính lãi suất ngân hàng</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 10px 20px;
            background-color: lightblue;
            border: 1px solid gray;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Tính lãi suất ngân hàng</h2>

        <label>Số tiền vay (triệu đồng):</label>
        <input type="number" id="money" placeholder="Nhập số tiền vay">

        <label>Lãi suất (%/năm):</label>
        <input type="number" id="rate" placeholder="Nhập lãi suất">

        <label>Số năm vay:</label>
        <input type="number" id="year" placeholder="Nhập số năm">

        <button onclick="calculate()">Tính tiền</button>

        <div id="result"></div>

    </div>

    <script>
        function calculate() {

            let money = Number(document.getElementById("money").value);
            let rate = Number(document.getElementById("rate").value);
            let year = Number(document.getElementById("year").value);

            if (money <= 0 || rate < 0 || year < 0 ||
                document.getElementById("money").value === "" ||
                document.getElementById("rate").value === "" ||
                document.getElementById("year").value === "") {

                alert("Vui lòng nhập dữ liệu hợp lệ!");
                return;
            }

            let interest = money * rate / 100 * year;

            let total = money + interest;

            document.getElementById("result").innerHTML =
                "Tiền lãi: " + interest + " triệu đồng<br>" +
                "Tổng tiền phải trả: " + total + " triệu đồng";
        }
    </script>

</body>
</html>
